# Produção no VPS, em /srv/screencord. API_VERSION vem do arquivo .env, escrito pelo deploy.sh.
services:
  api:
    image: ghcr.io/miguelsoeth/screencord.api:${API_VERSION:?defina API_VERSION}
    restart: unless-stopped
    # Roda como o usuário deploy do VPS (uid 1000), dono de data/. Assim o backup.sh e o deploy.sh,
    # que rodam como deploy, conseguem ler o SQLite (em modo WAL, até a leitura precisa escrever o -shm).
    user: "1000:1000"
    env_file: api.env
    environment:
      Proxy__TrustForwardedHeaders: "true"
    volumes:
      - ./data:/data
    # Só para o health check do deploy.sh; de fora, o acesso é apenas pelo Caddy.
    ports:
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./downloads:/srv/downloads:ro
      # Certificados e conta ACME persistem entre deploys (evita o rate limit da Let's Encrypt).
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
